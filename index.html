<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex">
  <title>M&amp;M Car Clinic</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <script>
    // Apply the saved theme before first paint (see js/theme.js).
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('mm.theme') || 'dark'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar no-print" id="topbar" hidden>
    <a href="#/overview" class="brand">
      <img src="assets/logo.png" alt="" width="28" height="28">
      <span>M&amp;M Car Clinic</span>
      <span class="demo-badge">Demo</span>
    </a>
    <button type="button" class="cmdk-open" id="cmdk-open">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <span>Search or jump to…</span>
      <span class="keys"><kbd id="cmdk-mod">Ctrl</kbd><kbd>K</kbd></span>
    </button>
    <nav aria-label="Main">
      <a href="#/overview" data-route="overview">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="5" height="5" rx="1"/><rect x="8.5" y="2.5" width="5" height="3" rx="1"/><rect x="8.5" y="7.5" width="5" height="6" rx="1"/><rect x="2.5" y="9.5" width="5" height="4" rx="1"/></svg>
        <span>Overview</span>
      </a>
      <a href="#/day" data-route="day">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h8.5a1.5 1.5 0 0 1 1.5 1.5v9.5H4.5A1.5 1.5 0 0 1 3 12V2.5Z"/><path d="M3 12a1.5 1.5 0 0 1 1.5-1.5H13M6 5.5h4"/></svg>
        <span>Daily</span>
      </a>
      <a href="#/month" data-route="month">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V7.5M8 11V4M11.5 11V9"/></svg>
        <span>Monthly</span>
      </a>
      <a href="#/inventory" data-route="inventory">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5 8 2.5 13.5 5v6L8 13.5 2.5 11V5Z"/><path d="M2.5 5 8 7.5 13.5 5M8 7.5v6"/></svg>
        <span>Inventory</span>
      </a>
      <a href="#/salary" data-route="salary">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4M10.5 3.2a2.5 2.5 0 0 1 0 4.6M12 9.8c1.3.5 2.2 1.8 2.5 3.7"/></svg>
        <span>Salary</span>
      </a>
      <a href="#/users" data-route="users" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13.5 4v3.6c0 3.2-2.3 5.8-5.5 6.6-3.2-.8-5.5-3.4-5.5-6.6V4L8 1.8Z"/><path d="m5.8 8 1.6 1.6L10.5 6.5"/></svg>
        <span>Users</span>
      </a>
      <a href="#/activity" data-route="activity" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg>
        <span>Activity</span>
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="whoami" id="whoami" hidden>
      <span class="avatar" aria-hidden="true"></span>
      <span class="who-text"><span class="who-name"></span><span class="who-role"></span></span>
      <button type="button" class="icon-btn" id="signout" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6"/></svg>
      </button>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle">
      <svg class="i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>
      <svg class="i-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
      <span>Dark</span>
    </button>
  </aside>
  <main id="view"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
